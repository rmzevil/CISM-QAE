<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CISM Quiz · 10th Ed</title>
<style>
/* ============ Design System ============ */
:root {
  --bg: #0a0e1a;
  --surface: #131826;
  --surface-2: #1a2030;
  --surface-3: #232b3d;
  --border: #2a3347;
  --border-strong: #3a455e;
  --text: #e8ecf3;
  --text-2: #aab3c5;
  --text-3: #6b7588;
  --accent: #6366f1;
  --accent-h: #7c7ff5;
  --accent-soft: rgba(99,102,241,0.15);
  --green: #10b981;
  --green-soft: rgba(16,185,129,0.15);
  --amber: #f59e0b;
  --amber-soft: rgba(245,158,11,0.15);
  --red: #ef4444;
  --red-soft: rgba(239,68,68,0.15);
  --blue: #3b82f6;
  --blue-soft: rgba(59,130,246,0.15);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.3);
  --shadow-hover: 0 4px 12px rgba(99,102,241,0.2);
  --transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="light"] {
  --bg: #f7f8fb;
  --surface: #ffffff;
  --surface-2: #f4f5f9;
  --surface-3: #ebedf2;
  --border: #e4e6eb;
  --border-strong: #d1d5db;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 16px rgba(99,102,241,0.15);
}

* { box-sizing:border-box; }
html, body { margin:0; padding:0; }
body {
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  transition: background 0.2s;
}

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,14,26,0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 12px;
}
[data-theme="light"] .topbar { background: rgba(255,255,255,0.85); }
.topbar h1 {
  margin: 0; font-size: 16px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.topbar h1 .sub { font-weight: 400; color: var(--text-3); font-size: 12px; }
.topbar .spacer { flex: 1; }
.topbar .icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-2);
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 13px;
  transition: var(--transition);
  display: inline-flex; align-items: center; gap: 6px;
}
.topbar .icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface-2); }
.sync-indicator {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px; font-weight: 500;
  background: var(--surface);
  border: 1px solid var(--border);
}
.sync-indicator.synced { color: var(--green); border-color: rgba(16,185,129,0.3); background: var(--green-soft); }
.sync-indicator.syncing { color: var(--blue); border-color: rgba(59,130,246,0.3); background: var(--blue-soft); }
.sync-indicator.offline { color: var(--text-3); }
.sync-indicator.error { color: var(--red); border-color: rgba(239,68,68,0.3); background: var(--red-soft); }
.sync-indicator .dot { width:6px; height:6px; border-radius:50%; background: currentColor; }
.sync-indicator.syncing .dot { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

.app { max-width: 1100px; margin: 0 auto; padding: 24px; }

/* Hero dashboard */
.hero {
  background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 24px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 32px;
  align-items: center;
}
.mastery-ring {
  position: relative;
  width: 140px; height: 140px;
  flex-shrink: 0;
}
.mastery-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.mastery-ring .ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 12; }
.mastery-ring .ring-fg {
  fill: none;
  stroke: url(#ringGrad);
  stroke-width: 12;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.8s ease;
}
.mastery-ring .label {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.mastery-ring .pct { font-size: 32px; font-weight: 800; }
.mastery-ring .pct-sub { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

.hero-stats { display: flex; flex-direction: column; gap: 12px; }
.hero-stats h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.hero-stats .lead { color: var(--text-2); font-size: 13px; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; }
.stat-row .stat {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
}
.stat .n { font-size: 20px; font-weight: 700; }
.stat .l { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.05em; }

/* Mode + Filter row */
.controls-bar {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  margin-bottom: 20px;
}
.seg {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  gap: 2px;
}
.seg button {
  background: transparent; border: none; color: var(--text-2);
  padding: 7px 14px; border-radius: 7px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: var(--transition);
  display: inline-flex; align-items: center; gap: 5px;
}
.seg button:hover { color: var(--text); }
.seg button.active {
  background: var(--accent); color: white;
  box-shadow: 0 1px 3px rgba(99,102,241,0.4);
}
.seg button.active.training { background: var(--green); box-shadow: 0 1px 3px rgba(16,185,129,0.4); }
.seg button.active.quiz { background: var(--amber); box-shadow: 0 1px 3px rgba(245,158,11,0.4); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-2);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex; align-items: center; gap: 5px;
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
}
.chip .count {
  background: var(--surface-3);
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11px;
}
.chip.active .count { background: var(--accent); color: white; }

.pool-info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 20px;
  color: var(--text-2);
}
.pool-info strong { color: var(--text); font-weight: 600; }
.pool-info .ico { color: var(--accent); }

/* Builder */
.builder {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 24px;
}
.builder-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px 24px;
  align-items: start;
  margin-bottom: 16px;
}
@media (max-width: 720px) {
  .builder-grid { grid-template-columns: 1fr; }
}
.bsec { margin-bottom: 16px; }
.bsec:last-child { margin-bottom: 0; }
.bsec-label {
  display: block;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-3);
  margin-bottom: 8px;
}
.bsec-hint {
  font-size: 12px; color: var(--text-3);
  margin-top: 6px; line-height: 1.5;
}

.src-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px;
}
.src-card {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-2);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}
.src-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--c, var(--accent));
  border-radius: 8px 0 0 8px;
}
.src-card:hover { border-color: var(--border-strong); }
.src-card.on {
  border-color: var(--c, var(--accent));
  background: var(--surface-3);
}
.src-card input[type="checkbox"] {
  width: 16px; height: 16px; cursor: pointer;
  accent-color: var(--c, var(--accent));
  flex-shrink: 0;
}
.src-info { flex: 1; min-width: 0; }
.src-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.src-meta { font-size: 11px; color: var(--text-3); }
.src-meta strong { color: var(--text-2); font-weight: 600; }
.src-weight {
  font-size: 11px;
  color: var(--text-3);
  padding: 2px 8px;
  background: var(--surface);
  border-radius: 10px;
  flex-shrink: 0;
}
.src-quick {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
}

.count-grid {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.count-btn {
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  min-width: 56px;
  transition: var(--transition);
}
.count-btn:hover:not(:disabled) { border-color: var(--border-strong); }
.count-btn.on {
  background: var(--accent); color: white; border-color: var(--accent);
}
.count-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.builder-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding-top: 16px;
  margin-top: 16px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.pool-summary {
  font-size: 13px; color: var(--text-2);
  flex: 1;
}
.pool-summary strong { color: var(--text); font-weight: 600; }
.btn-start {
  background: var(--accent); color: white;
  border: none;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 2px 8px rgba(99,102,241,0.3);
}
.btn-start:hover:not(:disabled) {
  background: var(--accent-h);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(99,102,241,0.4);
}
.btn-start.training { background: var(--green); box-shadow: 0 2px 8px rgba(16,185,129,0.3); }
.btn-start.training:hover:not(:disabled) { background: #0fa372; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
.btn-start.exam { background: var(--amber); box-shadow: 0 2px 8px rgba(245,158,11,0.3); }
.btn-start.exam:hover:not(:disabled) { background: #d68a08; box-shadow: 0 4px 12px rgba(245,158,11,0.4); }
.btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

[type="number"] {
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 7px 10px; font-size: 13px;
}
[type="number"]:focus { outline: none; border-color: var(--accent); }

/* Cards */
.domain-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.dcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.dcard:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.dcard::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent);
}
.dcard.d1::before { background: #6366f1; }
.dcard.d2::before { background: #10b981; }
.dcard.d3::before { background: #f59e0b; }
.dcard.d4::before { background: #ef4444; }
.dcard.sample::before { background: linear-gradient(180deg, #6366f1, #ec4899); }

.dcard-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.dcard h3 { margin: 0; font-size: 15px; font-weight: 600; }
.dcard .weight { font-size: 11px; color: var(--text-3); padding: 2px 8px; background: var(--surface-2); border-radius: 10px; }
.dcard .sub { color: var(--text-3); font-size: 12px; margin-bottom: 12px; }

.dprogress { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
.dprogress > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.6s ease; }
.dcard.d1 .dprogress > div { background: #6366f1; }
.dcard.d2 .dprogress > div { background: #10b981; }
.dcard.d3 .dprogress > div { background: #f59e0b; }
.dcard.d4 .dprogress > div { background: #ef4444; }
.dcard.sample .dprogress > div { background: linear-gradient(90deg, #6366f1, #ec4899); }

.dcard-stats { display: flex; gap: 14px; font-size: 12px; margin-bottom: 14px; color: var(--text-3); }
.dcard-stats span strong { color: var(--text); font-weight: 600; font-size: 13px; }
.dcard-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  background: var(--accent); color: white; border: none;
  padding: 8px 14px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; cursor: pointer;
  transition: var(--transition);
}
.btn:hover { background: var(--accent-h); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-3); border-color: var(--border-strong); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-block { width: 100%; }
.btn-success { background: var(--green); } .btn-success:hover { background: #0fa372; }
.btn-warning { background: var(--amber); } .btn-warning:hover { background: #d68a08; }

/* Question screen */
.qscreen { max-width: 800px; margin: 0 auto; padding: 24px; }
.q-progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
.q-progress > div { height: 100%; background: var(--accent); transition: width 0.3s; }
.qcard {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
}
.qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
.qhead-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; }
.q-badge {
  background: var(--surface-2); border: 1px solid var(--border);
  padding: 3px 10px; border-radius: 12px;
  font-weight: 500; color: var(--text-2);
}
.q-badge.mode-practice { color: var(--text-2); }
.q-badge.mode-training { color: var(--green); border-color: rgba(16,185,129,0.3); background: var(--green-soft); }
.q-badge.mode-quiz { color: var(--amber); border-color: rgba(245,158,11,0.3); background: var(--amber-soft); }
.qhead-actions { display: flex; gap: 6px; }

.qtext {
  font-size: 16px; line-height: 1.65; margin-bottom: 20px; color: var(--text);
}

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  cursor: pointer;
  display: flex; gap: 12px; align-items: flex-start;
  transition: var(--transition);
  font-size: 14px; line-height: 1.5;
}
.opt:hover:not(.locked) {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.opt .L {
  font-weight: 700; color: var(--accent); flex-shrink: 0; min-width: 22px;
  font-size: 15px;
}
.opt .T { flex: 1; }
.opt.selected { border-color: var(--accent); background: var(--accent-soft); }
.opt.locked { cursor: not-allowed; }
.opt.correct { border-color: var(--green); background: var(--green-soft); }
.opt.correct .L { color: var(--green); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .L { color: var(--red); }
.opt.locked.correct::after, .opt.locked.wrong::after {
  margin-left: auto; font-size: 18px; flex-shrink: 0;
}
.opt.locked.correct::after { content: '✓'; color: var(--green); }
.opt.locked.wrong::after { content: '✗'; color: var(--red); }

.feedback {
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  margin-top: 16px;
  font-size: 14px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
}
.feedback.ok { background: var(--green-soft); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.feedback.no { background: var(--red-soft); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }

.justifications { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
.justifications h4 {
  font-size: 11px; margin: 0 0 12px;
  color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em;
}
.just {
  padding: 11px 14px; margin-bottom: 8px;
  background: var(--surface-2); border-radius: var(--radius-sm);
  font-size: 13px; line-height: 1.55;
  border-left: 3px solid transparent;
}
.just.correct { border-left-color: var(--green); background: var(--green-soft); }
.just .L { font-weight: 700; margin-right: 6px; color: var(--text-2); }
.just.correct .L { color: var(--green); }

.controls {
  display: flex; gap: 10px; margin-top: 22px;
  padding-top: 18px; border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.controls .btn { flex: 1; min-width: 120px; }

/* Score screen */
.score-card { text-align: center; padding: 32px 24px; }
.score-ring { width: 160px; height: 160px; margin: 0 auto 16px; position: relative; }
.score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.score-ring .ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 14; }
.score-ring .ring-fg { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.score-ring .num {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.score-ring .num strong { font-size: 38px; font-weight: 800; }
.score-ring .num .of { font-size: 12px; color: var(--text-3); }
.score-status { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.score-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* Settings panel */
.panel-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.panel-bg.open { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; height: 100vh; width: 420px; max-width: 100vw;
  background: var(--surface); border-left: 1px solid var(--border);
  z-index: 101;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.panel.open { transform: translateX(0); }
.panel-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--surface); z-index: 1;
}
.panel-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.panel-body { padding: 20px; flex: 1; }
.panel-section { margin-bottom: 24px; }
.panel-section h3 {
  margin: 0 0 10px; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-3);
}
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; font-weight: 500; }
.field input, .field textarea, .field select {
  width: 100%; padding: 8px 10px;
  background: var(--surface-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font: inherit; font-size: 13px;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field textarea { min-height: 120px; font-family: 'SF Mono', Monaco, monospace; font-size: 11px; }
.field .help { font-size: 11px; color: var(--text-3); margin-top: 4px; line-height: 1.4; }
.field .help a { color: var(--accent); text-decoration: none; }

.row-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
.notice {
  padding: 10px 12px; border-radius: var(--radius-sm);
  font-size: 12px; line-height: 1.5;
  background: var(--surface-2); border: 1px solid var(--border);
  margin-top: 8px;
}
.notice.success { background: var(--green-soft); border-color: rgba(16,185,129,0.3); color: var(--green); }
.notice.error { background: var(--red-soft); border-color: rgba(239,68,68,0.3); color: var(--red); }
.notice.warn { background: var(--amber-soft); border-color: rgba(245,158,11,0.3); color: var(--amber); }

/* Section heading */
.section-h {
  display: flex; justify-content: space-between; align-items: center;
  margin: 24px 0 12px;
}
.section-h h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text-2); }
.section-h .meta { font-size: 12px; color: var(--text-3); }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius); padding: 12px 16px;
  font-size: 13px; z-index: 200;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transform: translateY(150%); opacity: 0;
  transition: all 0.25s ease;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: rgba(16,185,129,0.4); color: var(--green); }
.toast.error { border-color: rgba(239,68,68,0.4); color: var(--red); }

/* Responsive */
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; text-align: center; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
  .topbar { padding: 10px 14px; }
  .app { padding: 14px; }
  .qcard { padding: 18px; }
  .qtext { font-size: 15px; }
  .opt { padding: 12px; font-size: 13px; }
  .panel { width: 100vw; }
}
</style>

const STORAGE = {
  progress: 'cism_progress_v1',
  bookmarks: 'cism_bookmarks_v1',
  theme: 'cism_theme_v1',
  sync: 'cism_sync_v1',
  syncMeta: 'cism_sync_meta_v1',
};

// ============ Utilities ============
function qid(q){return q.section==='sample' ? `s${q.num}` : `${q.domain}-${q.num}`;}
function getQ(id){
  if(id.startsWith('s')) return DATA.sample_exam.find(q=>q.num===parseInt(id.slice(1)));
  const [d,n]=id.split('-').map(Number);
  return DATA.questions.find(q=>q.domain===d && q.num===n);
}
function escape(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[r[i],r[j]]=[r[j],r[i]];}return r;}

function loadJSON(key,def){try{return JSON.parse(localStorage[key])||def}catch{return def}}
function saveJSON(key,val){localStorage[key]=JSON.stringify(val);}

let progress = loadJSON(STORAGE.progress, {});
let bookmarks = new Set(loadJSON(STORAGE.bookmarks, []));
let syncConfig = loadJSON(STORAGE.sync, {apiKey:'', binId:'', enabled:false});
let syncMeta = loadJSON(STORAGE.syncMeta, {lastSync:0, lastError:''});

const saveProgress = () => { saveJSON(STORAGE.progress, progress); scheduleSync(); };
const saveBookmarks = () => { saveJSON(STORAGE.bookmarks, [...bookmarks]); scheduleSync(); };

// ============ Theme ============
function loadTheme(){

}
function toggleTheme(){

  localStorage[STORAGE.theme] = next;

}

// ============ Toast ============
function toast(msg, kind=''){
  const el = document.getElementById('toast');
  el.className = 'toast show ' + kind;
  el.textContent = msg;
  setTimeout(()=>el.className='toast', 2800);
}

// ============ Sync (jsonbin.io) ============
let syncTimer = null;
function scheduleSync(){
  if(!syncConfig.enabled || !syncConfig.apiKey || !syncConfig.binId) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>doSync('push'), 3000);
}
async function doSync(mode='push'){
  if(!syncConfig.apiKey || !syncConfig.binId){
    setSyncBadge('offline','Local only'); return;
  }
  setSyncBadge('syncing','Syncing…');
  const url = `https://api.jsonbin.io/v3/b/${syncConfig.binId}` + (mode==='pull' ? '/latest' : '');
  try {
    if(mode==='pull' || mode==='sync'){
      const r = await fetch(url, {headers: {'X-Master-Key': syncConfig.apiKey}});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json();
      const remote = j.record || {};
      if(remote.progress){
        for(const id in remote.progress){
          const inc = remote.progress[id];
          const ex = progress[id] || {correct:0,wrong:0};
          progress[id] = {
            correct: Math.max(ex.correct||0, inc.correct||0),
            wrong: Math.max(ex.wrong||0, inc.wrong||0),
          };
        }
        saveJSON(STORAGE.progress, progress);
      }
      if(Array.isArray(remote.bookmarks)){
        remote.bookmarks.forEach(id=>bookmarks.add(id));
        saveJSON(STORAGE.bookmarks, [...bookmarks]);
      }
    }
    if(mode==='push' || mode==='sync'){
      const payload = JSON.stringify({progress, bookmarks:[...bookmarks], _meta:{updatedAt: Date.now()}});
      const r = await fetch(`https://api.jsonbin.io/v3/b/${syncConfig.binId}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json','X-Master-Key': syncConfig.apiKey},
        body: payload,
      });
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
    }
    syncMeta.lastSync = Date.now();
    syncMeta.lastError = '';
    saveJSON(STORAGE.syncMeta, syncMeta);
    setSyncBadge('synced', 'Synced');
    if(mode==='pull' || mode==='sync') renderHome();
    return true;
  } catch(e){
    syncMeta.lastError = String(e.message || e);
    saveJSON(STORAGE.syncMeta, syncMeta);
    setSyncBadge('error', 'Sync error');
    return false;
  }
}
function setSyncBadge(state, text){
  const b = document.getElementById('syncBadge');
  b.className = 'sync-indicator ' + state;
  document.getElementById('syncText').textContent = text;
}
function setSyncStateFromConfig(){
  if(!syncConfig.enabled){ setSyncBadge('offline','Local only'); return; }
  if(syncMeta.lastError){ setSyncBadge('error','Sync error'); return; }
  if(syncMeta.lastSync){
    const min = Math.round((Date.now()-syncMeta.lastSync)/60000);
    setSyncBadge('synced', min<1 ? 'Synced now' : `Synced ${min}m ago`);
  } else {
    setSyncBadge('offline','Not synced yet');
  }
}

async function createBin(){
  const r = await fetch('https://api.jsonbin.io/v3/b', {
    method: 'POST',
    headers: {'Content-Type':'application/json','X-Master-Key': syncConfig.apiKey,'X-Bin-Name':'cism-quiz-progress'},
    body: JSON.stringify({progress, bookmarks:[...bookmarks]}),
  });
  if(!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
  const j = await r.json();
  return j.metadata.id;
}

// ============ Migration ============
function migrateOldProgress(oldProg){
  // Detects old numeric IDs ('1', '2', ...) and maps positionally to new format.
  const numericKeys = Object.keys(oldProg).filter(k => /^\d+$/.test(k));
  if(numericKeys.length === 0) return {migrated:0, total:Object.keys(oldProg).length};
  
  const ordered = [...DATA.questions].sort((a,b) => a.domain - b.domain || a.num - b.num);
  let migrated = 0;
  for(const oldKey of numericKeys){
    const idx = parseInt(oldKey) - 1;  // 1-indexed
    if(idx < 0 || idx >= ordered.length) continue;
    const q = ordered[idx];
    const newKey = `${q.domain}-${q.num}`;
    const v = oldProg[oldKey];
    if(!progress[newKey]) progress[newKey] = {correct:0, wrong:0};
    progress[newKey].correct = Math.max(progress[newKey].correct, v.correct||0);
    progress[newKey].wrong = Math.max(progress[newKey].wrong, v.wrong||0);
    migrated++;
  }
  return {migrated, total: Object.keys(oldProg).length};
}

// ============ Stats ============
function computeStats(){
  // Returns: total/seen/mastered/missed + per-domain breakdown
  let seen=0, mastered=0, missed=0;
  const byD = {1:{t:0,s:0,m:0},2:{t:0,s:0,m:0},3:{t:0,s:0,m:0},4:{t:0,s:0,m:0}, sample:{t:0,s:0,m:0}};
  
  for(const q of DATA.questions){
    byD[q.domain].t++;
    const p = progress[`${q.domain}-${q.num}`];
    if(p && (p.correct>0 || p.wrong>0)){
      seen++; byD[q.domain].s++;
      if(p.correct > p.wrong){ mastered++; byD[q.domain].m++; }
      if(p.wrong>0 && p.wrong>=p.correct) missed++;
    }
  }
  for(const q of DATA.sample_exam){
    byD.sample.t++;
    const p = progress[`s${q.num}`];
    if(p && (p.correct>0 || p.wrong>0)){
      seen++; byD.sample.s++;
      if(p.correct > p.wrong){ mastered++; byD.sample.m++; }
      if(p.wrong>0 && p.wrong>=p.correct) missed++;
    }
  }
  
  const total = DATA.questions.length + DATA.sample_exam.length;
  return {total, seen, mastered, missed, bookmarks: bookmarks.size, byD,
          masteryPct: total ? Math.round(mastered/total*100) : 0};
}

function getPool(scope, opts={}){
  // scope: 'all', 'd1'..'d4', 'sample', 'bookmarks', 'missed'
  let pool;
  if(scope==='bookmarks'){
    pool = [...bookmarks].map(id=>{
      const q = getQ(id); return q ? {...q, section: id.startsWith('s')?'sample':'domain'} : null;
    }).filter(Boolean);
  } else if(scope==='missed'){
    pool = Object.entries(progress).filter(([id,p])=>p.wrong>0 && p.wrong>=p.correct)
      .map(([id])=>{const q=getQ(id); return q?{...q, section:id.startsWith('s')?'sample':'domain'}:null;})
      .filter(Boolean);
  } else if(scope==='sample'){
    pool = DATA.sample_exam.map(q=>({...q, section:'sample'}));
  } else if(scope==='all'){
    pool = [...DATA.questions.map(q=>({...q, section:'domain'})), ...DATA.sample_exam.map(q=>({...q, section:'sample'}))];
  } else if(/^d[1-4]$/.test(scope)){
    const d = parseInt(scope.slice(1));
    pool = DATA.questions.filter(q=>q.domain===d).map(q=>({...q, section:'domain'}));
  } else { pool = []; }
  
  // Apply view filter (does not apply to 'missed' or 'bookmarks' scope — those are explicit)
  const filter = opts.ignoreFilter ? 'all' : viewState.filter;
  if(filter==='unseen') pool = pool.filter(q=>!progress[qid(q)] || (progress[qid(q)].correct===0 && progress[qid(q)].wrong===0));
  else if(filter==='missed') pool = pool.filter(q=>{const p=progress[qid(q)]; return p && p.wrong>0 && p.wrong>=p.correct;});
  else if(filter==='bookmarked') pool = pool.filter(q=>bookmarks.has(qid(q)));
  else if(filter==='mastered') pool = pool.filter(q=>{const p=progress[qid(q)]; return p && p.correct>p.wrong;});
  
  return pool;
}
function poolSize(scope){return getPool(scope).length;}

let session = null;

function startSession({mode, scope, pool, limit}){
  if(!pool || pool.length===0){ toast('No questions match the current filter.', 'error'); return; }
  pool = shuffle(pool);
  if(limit && pool.length>limit) pool = pool.slice(0, limit);
  session = {mode, scope, pool, idx:0, answers:[], submitted:[]};
  renderQ();
}
function endSession(){ session=null; renderHome(); }

          <input type="number" id="customCount" placeholder="Custom" min="1" max="9999" value="${![10,20,50,100,150,200,300].includes(viewState.count)?viewState.count:''}" onchange="setCount(Math.max(1, parseInt(this.value)||50))" style="width:100px;">
          <button class="count-btn ${viewState.count>=poolSize && poolSize>0?'on':''}" onclick="setCount(${poolSize})" ${poolSize===0?'disabled':''}>Max (${poolSize})</button>
        </div>
      </div>
      
      <div class="builder-footer">
        <div class="pool-summary">
          ${poolSize===0
            ? `<span style="color:var(--red)"><strong>0 questions match</strong> — adjust filter or sources</span>`
            : effectiveCount < viewState.count
            ? `<strong style="color:var(--accent)">${effectiveCount}</strong> questions will be picked randomly · capped from ${viewState.count} (only ${poolSize} match filter)`
            : `<strong style="color:var(--accent)">${effectiveCount}</strong> questions will be picked randomly from <strong>${poolSize}</strong> matching`
          }
        </div>
        <button class="btn-start ${viewState.mode}" onclick="startBuilder()" ${poolSize===0?'disabled':''}>
          ${viewState.mode==='training' ? '🎓 Start Training' : '📝 Start Exam'} · ${effectiveCount} Q
        </button>
      </div>
    </div>
    
    <div class="section-h"><h2>Progress by Domain</h2><span class="meta">Reference only</span></div>
    <div class="domain-grid">
      ${[1,2,3,4].map(d=>{
        const dInf = dInfo[d];
        const bD = s.byD[d];
        const pct = bD.t ? Math.round(bD.m/bD.t*100) : 0;
        return `
          <div class="dcard d${d}">
            <div class="dcard-head">
              <h3>D${d} · ${dInf.name}</h3>
              <span class="weight">${dInf.weight}%</span>
            </div>
            <div class="dprogress"><div style="width:${pct}%"></div></div>
            <div class="dcard-stats">
              <span><strong>${bD.m}</strong> mastered</span>
              <span><strong>${bD.s-bD.m}</strong> learning</span>
              <span><strong>${bD.t-bD.s}</strong> unseen</span>
            </div>
          </div>`;
      }).join('')}
      <div class="dcard sample">
        <div class="dcard-head">
          <h3>🎯 Sample Exam</h3>
          <span class="weight">150 Qs</span>
        </div>
        <div class="dprogress"><div style="width:${s.byD.sample.t?Math.round(s.byD.sample.m/s.byD.sample.t*100):0}%"></div></div>
        <div class="dcard-stats">
          <span><strong>${s.byD.sample.m}</strong> mastered</span>
          <span><strong>${s.byD.sample.s-s.byD.sample.m}</strong> learning</span>
          <span><strong>${s.byD.sample.t-s.byD.sample.s}</strong> unseen</span>
        </div>
      </div>
    </div>
  `;
  document.getElementById('screen').innerHTML = html;
}

// Builder selection logic
function buildPoolFromSelections(){
  // Union of selected sources, then apply filter
  let pool = [];
  for(const src of viewState.domains){
    pool = pool.concat(getPool(src, {ignoreFilter:true}));
  }
  // Dedupe by id (shouldn't matter for domain/sample but defensive)
  const seen = new Set();
  pool = pool.filter(q=>{ const id=qid(q); if(seen.has(id)) return false; seen.add(id); return true; });
  // Apply filter
  const f = viewState.filter;
  if(f==='unseen') pool = pool.filter(q=>!progress[qid(q)] || (progress[qid(q)].correct===0 && progress[qid(q)].wrong===0));
  else if(f==='missed') pool = pool.filter(q=>{const p=progress[qid(q)]; return p && p.wrong>0 && p.wrong>=p.correct;});
  else if(f==='bookmarked') pool = pool.filter(q=>bookmarks.has(qid(q)));
  else if(f==='mastered') pool = pool.filter(q=>{const p=progress[qid(q)]; return p && p.correct>p.wrong;});
  return pool;
}

function setMode(m){ viewState.mode = m; saveViewState(); renderHome(); }
function setFilter(f){ viewState.filter = f; saveViewState(); renderHome(); }
function setCount(n){ viewState.count = Math.max(1, n); saveViewState(); renderHome(); }
function toggleDomain(key){
  const i = viewState.domains.indexOf(key);
  if(i>=0) viewState.domains.splice(i,1);
  else viewState.domains.push(key);
  saveViewState(); renderHome();
}
function setDomains(list){ viewState.domains = list; saveViewState(); renderHome(); }

function startBuilder(){
  const pool = buildPoolFromSelections();
  if(pool.length===0){ toast('No questions match — adjust filter or sources', 'error'); return; }
  const limit = Math.min(viewState.count, pool.length);
  // Map mode 'exam' → 'quiz' internally (session logic uses 'quiz' for no-feedback flow)
  const sessionMode = viewState.mode==='exam' ? 'quiz' : 'training';
  startSession({mode: sessionMode, scope: 'builder', pool, limit});
}

// ============ Render: Question ============
function renderQ(){
  if(!session) return renderHome();
  const q = session.pool[session.idx];
  if(!q) return endSession();
  
  const id = qid(q);
  const userAns = session.answers[session.idx];
  const submitted = session.submitted[session.idx];
  const showAns = submitted && (session.mode==='practice' || session.mode==='training');
  const isBM = bookmarks.has(id);
  
  const sectionLabel = q.section==='sample' ? `Sample Q${q.num}` : `D${q.domain} · Q${q.num}`;
  const refLabel = q.ref_domain ? ` <span style="color:var(--text-3);font-size:11px;">→ D${q.ref_domain} Q${q.ref_qnum}</span>` : '';
  
  let html = `
    <div class="q-progress"><div style="width:${(session.idx+1)/session.pool.length*100}%"></div></div>
    <div class="qcard">
      <div class="qhead">
        <div class="qhead-info">
          <span class="q-badge">${session.idx+1} / ${session.pool.length}</span>
          <span class="q-badge mode-${session.mode}">${session.mode==='quiz'?'EXAM':session.mode.toUpperCase()}</span>
          <span>${sectionLabel}${refLabel}</span>
        </div>
        <div class="qhead-actions">
          <button class="icon-btn" onclick="toggleBM('${id}')">${isBM?'⭐':'☆'}</button>
          <button class="icon-btn" onclick="confirmExit()">✕ Exit</button>
        </div>
      </div>
      <div class="qtext">${escape(q.question)}</div>
      <div class="opts">
        ${['A','B','C','D'].map(L=>{
          let cls = 'opt';
          if(showAns){
            cls += ' locked';
            if(L===q.correct) cls += ' correct';
            else if(L===userAns) cls += ' wrong';
          } else if(userAns===L){ cls += ' selected'; }
          return `<div class="${cls}" onclick="selectOpt('${L}')">
            <span class="L">${L}.</span>
            <span class="T">${escape(q.options[L]||'')}</span>
          </div>`;
        }).join('')}
      </div>
  `;
  
  if(showAns){
    const correct = userAns===q.correct;
    html += `<div class="feedback ${correct?'ok':'no'}">${correct?'✓ Correct':'✗ Incorrect'} — Answer: <strong>${q.correct}</strong></div>`;
    let justSource = q.justifications;
    if(q.section==='sample' && q.ref_domain){
      const refQ = DATA.questions.find(rq=>rq.domain===q.ref_domain && rq.num===q.ref_qnum);
      if(refQ && refQ.justifications) justSource = refQ.justifications;
    }
    if(justSource && Object.values(justSource).some(v=>v)){
      html += `<div class="justifications"><h4>Justifications${q.section==='sample'?` (from D${q.ref_domain} Q${q.ref_qnum})`:''}</h4>`;
      ['A','B','C','D'].forEach(L=>{
        if(!justSource[L]) return;
        html += `<div class="just ${L===q.correct?'correct':''}"><span class="L">${L}.</span>${escape(justSource[L])}</div>`;
      });
      html += `</div>`;
    }
  }
  
  html += `<div class="controls">`;
  html += `<button class="btn btn-ghost" onclick="prev()" ${session.idx===0?'disabled':''}>← Prev</button>`;
  if(!submitted && (session.mode==='practice' || session.mode==='training')){
    html += `<button class="btn" onclick="submitAns()" ${userAns===undefined?'disabled':''}>Submit Answer</button>`;
  } else {
    const isLast = session.idx === session.pool.length-1;
    html += `<button class="btn" onclick="next()">${isLast ? (session.mode==='practice'?'Finish':'See Score') : 'Next →'}</button>`;
  }
  html += `</div></div>`;
  
  document.getElementById('screen').innerHTML = html;
}

function selectOpt(L){
  if(!session) return;
  if(session.submitted[session.idx]) return;
  session.answers[session.idx] = L;
  if(session.mode==='quiz'){
    // record and auto-advance
    const q = session.pool[session.idx];
    const id = qid(q);
    if(!progress[id]) progress[id] = {correct:0, wrong:0};
    if(L===q.correct) progress[id].correct++; else progress[id].wrong++;
    session.submitted[session.idx] = true;
    saveProgress();
    setTimeout(()=>{
      if(session.idx >= session.pool.length-1) finishSession();
      else { session.idx++; renderQ(); }
    }, 100);
  } else {
    renderQ();
  }
}

function submitAns(){
  const q = session.pool[session.idx];
  const ans = session.answers[session.idx];
  if(!ans) return;
  const id = qid(q);
  if(!progress[id]) progress[id] = {correct:0, wrong:0};
  if(ans===q.correct) progress[id].correct++; else progress[id].wrong++;
  session.submitted[session.idx] = true;
  saveProgress();
  renderQ();
}

function next(){
  if(session.idx >= session.pool.length-1){
    if(session.mode==='practice') endSession();
    else finishSession();
    return;
  }
  session.idx++; renderQ();
}
function prev(){ if(session.idx>0){ session.idx--; renderQ(); } }

function toggleBM(id){
  if(bookmarks.has(id)) bookmarks.delete(id); else bookmarks.add(id);
  saveBookmarks();
  if(session) renderQ(); else renderHome();
}
function confirmExit(){
  if(session && session.answers.length>0 && (session.mode==='training'||session.mode==='quiz')){
    if(!confirm('Exit this session? Progress on answered questions is already saved.')) return;
  }
  endSession();
}

function finishSession(){
  let correct=0;
  session.pool.forEach((q,i)=>{ if(session.answers[i]===q.correct) correct++; });
  const total = session.pool.length;
  const pct = Math.round(correct/total*100);
  const passing = pct >= 70;
  const ringCirc = 2 * Math.PI * 60;
  
  document.getElementById('screen').innerHTML = `
    <div class="qcard score-card">
      <div class="score-ring">
        <svg viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="60" class="ring-bg"/>
          <circle cx="80" cy="80" r="60" class="ring-fg"
            stroke="${passing?'#10b981':'#ef4444'}"
            stroke-dasharray="${ringCirc}"
            stroke-dashoffset="${ringCirc*(1-pct/100)}"/>
        </svg>
        <div class="num"><strong>${pct}%</strong><span class="of">${correct} / ${total}</span></div>
      </div>
      <div class="score-status" style="color:${passing?'var(--green)':'var(--red)'}">
        ${passing ? '✓ Passing (70%+)' : 'Below passing'}
      </div>
      <div class="score-actions">
        <button class="btn" onclick="reviewAll()">Review All ${total}</button>
        ${correct<total ? `<button class="btn btn-ghost" onclick="reviewWrong()">Review ${total-correct} Missed</button>` : ''}
        <button class="btn btn-ghost" onclick="endSession()">Done</button>
      </div>
    </div>
  `;
}
function reviewAll(){ session.mode='practice'; session.idx=0; session.submitted = session.pool.map(()=>true); renderQ(); }
function reviewWrong(){
  const wrongIdx = session.answers.map((a,i)=>a!==session.pool[i].correct?i:-1).filter(i=>i>=0);
  session.pool = wrongIdx.map(i=>session.pool[i]);
  session.answers = wrongIdx.map(i=>session.answers[i]);
  session.submitted = session.pool.map(()=>true);
  session.mode='practice'; session.idx=0;
  renderQ();
}

// ============ Keyboard ============
document.addEventListener('keydown', (e)=>{
  if(!session) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const k = e.key.toUpperCase();
  if('ABCD'.includes(k)){ selectOpt(k); e.preventDefault(); }
  else if('1234'.includes(k)){ selectOpt('ABCD'[parseInt(k)-1]); e.preventDefault(); }
  else if(e.key==='Enter'){
    const submitted = session.submitted[session.idx];
    if(!submitted && session.answers[session.idx] && (session.mode==='practice'||session.mode==='training')) submitAns();
    else next();
    e.preventDefault();
  }
  else if(e.key==='ArrowLeft'){ prev(); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ next(); e.preventDefault(); }
  else if(e.key==='Escape'){ confirmExit(); e.preventDefault(); }
});

// ============ Settings panel ============
function openSettings(){
  renderSettings();
  document.getElementById('panel').classList.add('open');
  document.getElementById('panelBg').classList.add('open');
}
function closeSettings(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panelBg').classList.remove('open');
}
function renderSettings(){
  const s = computeStats();
  const lastSyncStr = syncMeta.lastSync ? new Date(syncMeta.lastSync).toLocaleString() : 'Never';
  const html = `
    <div class="panel-section">
      <h3>☁️ Cloud Sync (jsonbin.io)</h3>
      <p style="color:var(--text-2);font-size:12px;margin:0 0 12px;line-height:1.5;">
        Sync your progress across devices. Free tier at <a href="https://jsonbin.io" target="_blank" style="color:var(--accent)">jsonbin.io</a>: 10k requests/month.
      </p>
      <div class="field">
        <label>API Key (X-Master-Key)</label>
        <input type="password" id="apiKey" value="${escape(syncConfig.apiKey)}" placeholder="$2a$10$...">
        <div class="help">Sign up at jsonbin.io, go to API Keys, copy your X-Master-Key.</div>
      </div>
      <div class="field">
        <label>Bin ID</label>
        <input id="binId" value="${escape(syncConfig.binId)}" placeholder="65f...">
        <div class="help">Leave empty + click "Create New Bin" to make one automatically.</div>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="syncEnabled" ${syncConfig.enabled?'checked':''} style="width:auto;">
          <span>Auto-sync on every change (3s debounce)</span>
        </label>
      </div>
      <div class="row-buttons">
        <button class="btn btn-sm" onclick="saveSyncConfig()">Save</button>
        <button class="btn btn-ghost btn-sm" onclick="testConnection()">Test Connection</button>
        <button class="btn btn-ghost btn-sm" onclick="createNewBin()">Create New Bin</button>
        <button class="btn btn-success btn-sm" onclick="manualSync()">Sync Now (pull+push)</button>
      </div>
      <div class="notice"><strong>Last sync:</strong> ${lastSyncStr}${syncMeta.lastError?`<br><strong>Error:</strong> ${escape(syncMeta.lastError)}`:''}</div>
    </div>
    
    <div class="panel-section">
      <h3>📥 Progress Data</h3>
      <p style="color:var(--text-2);font-size:12px;margin:0 0 10px;">
        <strong>Current:</strong> ${Object.keys(progress).length} progress entries · ${bookmarks.size} bookmarks
      </p>
      <div class="row-buttons">
        <button class="btn btn-ghost btn-sm" onclick="exportProgress()">Export JSON</button>
        <button class="btn btn-ghost btn-sm" onclick="downloadProgress()">Download File</button>
      </div>
      <div class="field" style="margin-top:12px;">
        <label>Import Progress (auto-detects old format)</label>
        <textarea id="importBox" placeholder="Paste exported JSON here..."></textarea>
      </div>
      <input type="file" id="importFile" accept=".json" style="font-size:12px;margin-bottom:8px;">
      <div class="row-buttons">
        <button class="btn btn-sm" onclick="doImport()">Import</button>
        <button class="btn btn-ghost btn-sm" onclick="resetProgress()" style="color:var(--red);">Reset All Progress</button>
      </div>
    </div>
    
    <div class="panel-section">
      <h3>🎨 Appearance</h3>
      <div class="row-buttons">
        <button class="btn btn-ghost btn-sm" onclick="toggleTheme();renderSettings();">Toggle Theme</button>
      </div>
    </div>
    
    <div class="panel-section">
      <h3>ℹ️ About</h3>
      <p style="color:var(--text-2);font-size:12px;line-height:1.6;margin:0;">
        Questions: ${DATA.questions.length} domain + ${DATA.sample_exam.length} sample = ${DATA.questions.length + DATA.sample_exam.length}<br>
        Mastery: ${s.mastered} / ${s.total} (${s.masteryPct}%)<br>
        Hosting: <a href="https://pages.github.com" target="_blank" style="color:var(--accent)">GitHub Pages</a> + <a href="https://jsonbin.io" target="_blank" style="color:var(--accent)">jsonbin.io</a> for sync
      </p>
    </div>
  `;
  document.getElementById('panelBody').innerHTML = html;
  document.getElementById('importFile').addEventListener('change', async (e)=>{
    const f = e.target.files[0]; if(!f) return;
    document.getElementById('importBox').value = await f.text();
  });
}

function saveSyncConfig(){
  syncConfig.apiKey = document.getElementById('apiKey').value.trim();
  syncConfig.binId = document.getElementById('binId').value.trim();
  syncConfig.enabled = document.getElementById('syncEnabled').checked;
  saveJSON(STORAGE.sync, syncConfig);
  toast('Settings saved', 'success');
  setSyncStateFromConfig();
}
async function testConnection(){
  saveSyncConfig();
  if(!syncConfig.apiKey){ toast('Enter your API key first', 'error'); return; }
  if(!syncConfig.binId){ toast('Enter a Bin ID or create a new bin', 'error'); return; }
  toast('Testing connection…');
  const ok = await doSync('pull');
  if(ok) toast('Connection works! Pulled remote data.', 'success');
  else toast('Connection failed: ' + (syncMeta.lastError||'Unknown'), 'error');
  renderSettings();
}
async function createNewBin(){
  saveSyncConfig();
  if(!syncConfig.apiKey){ toast('Enter your API key first', 'error'); return; }
  toast('Creating bin…');
  try {
    const id = await createBin();
    syncConfig.binId = id;
    syncConfig.enabled = true;
    saveJSON(STORAGE.sync, syncConfig);
    document.getElementById('binId').value = id;
    document.getElementById('syncEnabled').checked = true;
    toast(`Bin created: ${id.slice(0,12)}…`, 'success');
    setSyncStateFromConfig();
  } catch(e){
    toast('Failed: ' + e.message, 'error');
  }
}
async function manualSync(){
  saveSyncConfig();
  toast('Syncing…');
  const ok = await doSync('sync');
  if(ok) toast('Synced successfully', 'success');
  else toast('Sync failed: ' + syncMeta.lastError, 'error');
  renderSettings();
  renderHome();
}

function exportProgress(){
  const data = JSON.stringify({progress, bookmarks:[...bookmarks]}, null, 2);
  document.getElementById('importBox').value = data;
  navigator.clipboard?.writeText(data);
  toast('Copied to clipboard', 'success');
}
function downloadProgress(){
  const data = JSON.stringify({progress, bookmarks:[...bookmarks]}, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = `cism-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
function doImport(){
  const txt = document.getElementById('importBox').value.trim();
  if(!txt){ toast('Nothing to import', 'error'); return; }
  let data;
  try { data = JSON.parse(txt); } catch(e){ toast('Invalid JSON: '+e.message, 'error'); return; }
  
  if(data.progress && typeof data.progress==='object'){
    const numericKeys = Object.keys(data.progress).filter(k=>/^\d+$/.test(k));
    if(numericKeys.length > 0){
      // Old format — migrate
      const ok = confirm(`Detected ${numericKeys.length} entries in OLD numeric ID format. Migrate them to the new format positionally? (Some may not map if questions were deduped between versions.)`);
      if(!ok) return;
      const r = migrateOldProgress(data.progress);
      saveJSON(STORAGE.progress, progress);
      toast(`Migrated ${r.migrated}/${r.total} old entries`, 'success');
    } else {
      // New format — direct merge
      let added = 0;
      for(const id in data.progress){
        const inc = data.progress[id];
        const ex = progress[id] || {correct:0, wrong:0};
        progress[id] = {
          correct: Math.max(ex.correct||0, inc.correct||0),
          wrong: Math.max(ex.wrong||0, inc.wrong||0),
        };
        added++;
      }
      saveJSON(STORAGE.progress, progress);
      toast(`Imported ${added} entries`, 'success');
    }
  }
  if(Array.isArray(data.bookmarks)){
    data.bookmarks.forEach(id=>bookmarks.add(id));
    saveBookmarks();
  }
  scheduleSync();
  renderSettings();
  renderHome();
}
function resetProgress(){
  if(!confirm('This will erase ALL progress and bookmarks. Are you sure?')) return;
  if(!confirm('Really? This cannot be undone (unless you have a cloud backup).')) return;
  progress = {}; bookmarks = new Set();
  saveJSON(STORAGE.progress, progress);
  saveJSON(STORAGE.bookmarks, [...bookmarks]);
  scheduleSync();
  toast('All progress reset', 'success');
  renderSettings(); renderHome();
}

// ============ Boot ============
async function boot(){
  // If sync configured + enabled, pull on startup
  if(syncConfig.enabled && syncConfig.apiKey && syncConfig.binId){
    await doSync('pull');
  }
  renderHome();
}
boot();
</script>
